<script>
    // ====== DRAG & DROP (event delegation — works for all cards, including new ones) ======
    document.addEventListener('dragstart', (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        if (card.classList.contains('editing')) { e.preventDefault(); return; }
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.id);
    });

    document.addEventListener('dragend', (e) => {
        const card = e.target.closest('.card');
        if (card) card.classList.remove('dragging');
        document.querySelectorAll('.lane-board.drag-over').forEach(b => b.classList.remove('drag-over'));
    });

    document.querySelectorAll('.lane-board').forEach(board => {
        board.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            board.classList.add('drag-over');
        });
        board.addEventListener('dragleave', (e) => {
            if (!board.contains(e.relatedTarget)) board.classList.remove('drag-over');
        });
        board.addEventListener('drop', (e) => {
            e.preventDefault();
            board.classList.remove('drag-over');
            const card = document.getElementById(e.dataTransfer.getData('text/plain'));
            if (card) { board.appendChild(card); updateCounts(); }
        });
    });

    // ====== CLICK TO EDIT (event delegation) ======
    document.addEventListener('click', (e) => {
        const card = e.target.closest('.card');
        if (!card || card.classList.contains('editing')) return;
        if (e.target.closest('.save-btn') || e.target.closest('.cancel-btn')) return;
        const contentDiv = card.querySelector('.card-content');
        if (!contentDiv) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'edit-input';
        input.value = contentDiv.textContent;

        const buttons = document.createElement('div');
        buttons.className = 'edit-buttons';
        const saveBtn = document.createElement('button');
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Save';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'cancel-btn';
        cancelBtn.textContent = 'Cancel';
        buttons.append(saveBtn, cancelBtn);

        card.append(input, buttons);
        contentDiv.remove();
        card.classList.add('editing');
        input.focus();
        input.select();

        let finished = false, canceling = false;
        cancelBtn.addEventListener('mousedown', () => { canceling = true; });

        function finish(save) {
            if (finished) return;
            finished = true;
            if (save && input.value.trim()) contentDiv.textContent = input.value.trim();
            input.remove();
            buttons.remove();
            card.prepend(contentDiv);
            card.classList.remove('editing');
            updateCounts();
        }

        saveBtn.addEventListener('click', () => finish(true));
        cancelBtn.addEventListener('click', () => finish(false));
        input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') finish(true);
            if (ev.key === 'Escape') finish(false);
        });
        input.addEventListener('blur', () => finish(!canceling));
    });

    // ====== CARD MANAGEMENT ======
    function updateCounts() {
        document.querySelectorAll('.lane').forEach(lane => {
            const board = lane.querySelector('.lane-board');
            lane.querySelector('.lane-count').textContent = board.querySelectorAll('.card').length;
        });
    }

    function addCard(btn) {
        const lane = btn.closest('.lane').dataset.lane;
        createCard('card-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5), 'New Task', lane);
        updateCounts();
    }

    function createCard(id, title, lane) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = id;
        card.draggable = true;
        const contentDiv = document.createElement('div');
        contentDiv.className = 'card-content';
        contentDiv.textContent = title;
        const desc = document.createElement('div');
        desc.className = 'card-desc';
        desc.textContent = 'Click to edit';
        card.append(contentDiv, desc);
        document.querySelector('[data-lane-board="' + lane + '"]').appendChild(card);
    }

    // ====== INITIALIZE ======
    createCard('card-1', 'Design landing page mockups', 'todo');
    createCard('card-2', 'Write API documentation', 'todo');
    createCard('card-3', 'Review team PRs', 'todo');
    updateCounts();
</script>
